<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>创世者的笔记本 · The Creator's Notebook</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230a0a0d'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23c9a86a' stroke-width='1.4'/%3E%3Ccircle cx='16' cy='16' r='2' fill='%23c9a86a'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="assets/style.css" />
</head>
<body>

<div class="app">

  <!-- ============ 侧栏 ============ -->
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-text">
        <strong>创世者的笔记本</strong>
        <em>The Creator's Notebook</em>
      </div>
    </div>

    <nav class="nav" id="nav"></nav>

    <div class="sidebar-foot">
      <button class="btn primary block" data-act="goto-poster">
        <svg viewBox="0 0 24 24" class="ico"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 19h16"/></svg>
        导出世界观长图
      </button>
      <div class="foot-links">
        <button class="linkbtn" data-act="export-json">备份数据</button>
        <i>·</i>
        <button class="linkbtn" data-act="import-json">导入</button>
        <i>·</i>
        <button class="linkbtn" data-act="reset-world">新建</button>
        <i>·</i>
        <button class="linkbtn" data-act="load-sample">示例</button>
      </div>
    </div>
  </aside>

  <!-- ============ 主区 ============ -->
  <main class="main">
    <header class="topbar">
      <div class="topbar-title">
        <input class="world-title" id="worldTitle" placeholder="为你的世界命名…" spellcheck="false" />
        <span class="crumb" id="crumb">总览</span>
      </div>
      <div class="topbar-right">
        <span class="save-state" id="saveState"><i></i>已保存</span>
        <button class="btn icon" data-act="export-poster" title="导出长图">
          <svg viewBox="0 0 24 24" class="ico"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 19h16"/></svg>
        </button>
      </div>
    </header>

    <section class="view" id="view"></section>
  </main>
</div>

<!-- ============ 抽屉：编辑表单 ============ -->
<div class="drawer-mask" id="drawerMask"></div>
<aside class="drawer" id="drawer" aria-hidden="true">
  <header class="drawer-head">
    <div>
      <span class="drawer-kicker" id="drawerKicker">编辑</span>
      <h2 id="drawerTitle">编辑</h2>
    </div>
    <button class="btn icon" data-act="close-drawer" aria-label="关闭">
      <svg viewBox="0 0 24 24" class="ico"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </header>
  <div class="drawer-body" id="drawerBody"></div>
  <footer class="drawer-foot">
    <button class="btn ghost" data-act="close-drawer">取消</button>
    <button class="btn primary" data-act="save-drawer">保存</button>
  </footer>
</aside>

<!-- ============ 大图查看器 ============ -->
<div class="lightbox" id="lightbox">
  <img alt="" id="lightboxImg" />
</div>

<div class="toast" id="toast"></div>

<script src="assets/imagekit.js"></script>
<script src="assets/store.js"></script>
<script src="assets/poster.js"></script>
<script src="assets/relations.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
